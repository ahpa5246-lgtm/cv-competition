name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify OpenCV
        run: python -c "import cv2; assert cv2.__version__.startswith('5.'); print(cv2.__version__)"
      - name: Unit tests
        run: pytest -q
      - name: Synthetic demo
        run: python -m simulation.synthetic_demo
      - name: Synthetic benchmark
        run: python -m simulation.benchmark --episodes 50
