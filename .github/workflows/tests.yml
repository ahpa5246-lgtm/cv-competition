name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Verify OpenCV
        run: python -c "import cv2; assert cv2.__version__.startswith('5.'); print(cv2.__version__)"
      - name: Unit tests
        run: python -m pytest -q
      - name: Synthetic demo
        run: python -m simulation.synthetic_demo
      - name: Synthetic benchmark
        run: python -m simulation.benchmark --episodes 50
      - name: Closed-loop recovery demo
        run: python -m simulation.closed_loop_demo
      - name: Recovery benchmark
        run: python -m simulation.recovery_benchmark --episodes 20
      - name: Human skill-transfer demo
        run: python -m simulation.skill_transfer_demo
      - name: YAML experiment harness demo
        run: python -m simulation.experiment_harness_demo
